          ### 📋 Installation Guide
          1. If your phone already has a third-party recovery (such as TWRP) installed, download the AnyKernel flashable zip for your model, boot into recovery, flash the zip, and reboot;
          2. If your phone already has root, install [HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases) on the phone, flash the AnyKernel zip in HorizonKernelFlasher, and reboot;
          3. If you have already flashed a SukiSU Ultra kernel and the SukiSU Ultra manager is updated to the latest version, you can flash the AnyKernel zip directly in the SukiSU Ultra manager and reboot;
          4. If you previously flashed a kernel with the lz4kd patch, turn off the zram module before flashing a kernel without the lz4kd patch, to avoid errors;
          5. Because KernelSU upstream added the metamodule feature, the latest KSU managers (including all branches except KernelSU Next) need a metamodule to mount modules properly. Current metamodules include [meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/), [meta magicmount rs](https://github.com/Tools-cx-app/meta-magic_mount/), [hybrid mount](https://github.com/YuzakiKokuban/meta-hybrid_mount) and others. If this is your first time using KSU, or you have just upgraded from an old KSU manager to a new one, install a metamodule first so that other modules that involve system mounting can run properly;
          6. KernelPatch Next (KPN) is a KPM implementation independent of KSU. It can run in any KSU/Magisk environment (not applicable to APatch) and cannot be used together with the KPM feature built into (Re)SukiSU. Before using it, make sure your kernel has no built-in KPM implementation/patch.
          
          #### ※※※ Flashing a kernel is risky. To prevent accidents that could brick your phone, be sure to back up the boot and other critical boot partitions with software such as [KernelFlasher](https://github.com/capntrips/KernelFlasher) before flashing a kernel! ※※※
